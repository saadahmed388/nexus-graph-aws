name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]  # Triggers the build every time you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Check out the repository code onto the GitHub runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Log into Docker Hub using your saved secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Set up Docker Buildx (enables advanced build features)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Build the image and automatically push it to Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # This tags it as username/jira-knowledge-bot-app:latest
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/jira-knowledge-bot-app:v1
